spring:
  jackson:
    deserialization:
      accept-float-as-int: false
  application:
    name: movie
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/umc_movie?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USER}
    password: ${DB_PW}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
server:
  port: ${SERVER_PORT:8080}
